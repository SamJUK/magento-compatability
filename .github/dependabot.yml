version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    assignees:
      - "SamJUK"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    versioning-strategy: "increase-if-necessary"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - "SamJUK"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/London"
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      workflow-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    assignees:
      - "SamJUK"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build"
    cooldown:
      default-days: 14
    groups:
      docker-base-images:
        patterns:
          - "*"
