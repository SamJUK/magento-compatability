name: Deploy

# Deploys a published image to the Swarm as the magentoworks stack (deploy/stack.yml). docker-publish.yml calls it
# after every release; run it by hand to redeploy or roll back to an earlier version.
#
# The steps of SamJUK/infra-swarm-platform's reusable deploy, inline: this repo is public and that one private, and
# GitHub lets only private repos call a private repo's workflows. The deploy itself is the manager's bin/deploy.sh.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      SWARM_SSH_KEY:
        required: true
      SWARM_MANAGER_HOST:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Image tag, e.g. 0.0.13
        required: true
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SWARM_SSH_KEY }}

      - name: Deploy
        env:
          HOST: ${{ secrets.SWARM_MANAGER_HOST }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 0.0.13, got: $VERSION"; exit 1; }
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "deploy@$HOST" "bin/deploy.sh magentoworks $VERSION" < deploy/stack.yml

      # Cloudflare keeps pages until this runs (site/nginx.conf), so a deploy without it serves the old site. Invalidate,
      # as infra-swarm-platform's deploy does: stale copies are revalidated on the next request, and can still be served
      # if the origin is down, where purged ones cannot. No stale-while-revalidate, so nobody gets the old page after.
      - name: Invalidate Cloudflare's cache
        env:
          ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$ZONE" ] && [ -n "$TOKEN" ] || { echo "::error::set the CLOUDFLARE_ZONE_ID variable and CLOUDFLARE_API_TOKEN secret (Cache Purge on magento.works, which covers invalidation)"; exit 1; }
          curl -fsS --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/invalidate_cache"

      - name: Show the stack on failure
        if: failure()
        env:
          HOST: ${{ secrets.SWARM_MANAGER_HOST }}
        run: ssh -o BatchMode=yes "deploy@$HOST" "docker stack ps magentoworks --no-trunc | head -30" || true
