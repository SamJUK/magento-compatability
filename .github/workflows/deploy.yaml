name: Deploy

# Deploys a published image to the Swarm as the magentoworks stack (deploy/stack.yml). docker-publish.yml calls it
# after every release; run it by hand to redeploy or roll back to an earlier version.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      SWARM_SSH_KEY:
        required: true
      SWARM_MANAGER_HOST:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Image tag, e.g. 0.0.13
        required: true
        type: string

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    uses: SamJUK/infra-swarm-platform/.github/workflows/deploy.yml@7922ebd30ce3fd5629f8c4352a3d2abf512018b2 # main
    permissions:
      contents: read
    secrets:
      SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
      SWARM_MANAGER_HOST: ${{ secrets.SWARM_MANAGER_HOST }}
    with:
      stack: magentoworks
      tag: ${{ inputs.version }}
