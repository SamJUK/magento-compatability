name: Sync Upstream Releases

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Sync upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Add new releases and refresh release dates
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/release-dates -summary "$RUNNER_TEMP/added.md"

      - name: Open a pull request when anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- matrix.yml site/src/data/release-dates.json; then
            echo "No new releases or dates."
            exit 0
          fi
          {
            if [ -s "$RUNNER_TEMP/added.md" ]; then
              echo 'New upstream releases added to matrix.yml. Each copies the baseline of the version below it. Run a sweep for each before merging.'
              echo
              cat "$RUNNER_TEMP/added.md"
              echo
            fi
            echo 'Release dates from magento.watch and the Mage-OS GitHub releases. If a new Magento line appears, add its support dates to site/src/data/adobe-support.yml.'
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

          branch=chore/upstream-releases
          title='chore: sync upstream releases'
          bot='github-actions[bot]'
          open=$([ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = OPEN ] && echo 1 || true)
          # Never overwrite someone's fixes to the open PR, such as a corrected baseline.
          if [ -n "$open" ] && git fetch -q --depth 1 origin "$branch" \
            && [ "$(git log -1 --format=%an FETCH_HEAD)" != "$bot" ]; then
            echo "::warning::$branch has commits that are not the bot's. Merge or close its PR so the sync can run."
            exit 0
          fi
          git config user.name "$bot"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -qam "$title"
          git push --force origin "$branch"
          if [ -n "$open" ]; then
            gh pr edit "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base master --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
