name: Sync Upstream Releases

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Sync upstream releases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      # Fails when Adobe recommends a version the services list can't run, after writing everything
      # else, so other changes still get their PR and the last step fails the run.
      - name: Add new releases, align baselines and refresh release dates
        id: sync
        continue-on-error: true
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/release-dates -summary "$RUNNER_TEMP/added.md"

      - name: Test
        working-directory: app
        run: go test ./...

      - name: Open a pull request when anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- matrix.yml site/src/data/release-dates.json; then
            echo "No new releases or dates."
            exit 0
          fi
          {
            if [ -s "$RUNNER_TEMP/added.md" ]; then
              echo "Changes to matrix.yml. Sweep every changed version before merging. To leave a release out for good, add it to its product's skip list; to stop a baseline being realigned, add it to keep_baseline."
              echo
              cat "$RUNNER_TEMP/added.md"
              echo
            fi
            echo 'Release dates from magento.watch and the Mage-OS GitHub releases. If a new Magento line appears, add its support dates to site/src/data/adobe-support.yml.'
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

          branch=chore/upstream-releases
          title='chore: sync upstream releases'
          bot='github-actions[bot]'
          # By owner, so a fork's PR from a branch of the same name is never picked up.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$branch" -q '.[0].number')
          # Never overwrite commits someone added to the open PR, such as a corrected baseline.
          if [ -n "$pr" ]; then
            git fetch -q --depth 1 origin "$branch"
            if [ "$(git log -1 --format=%cn FETCH_HEAD)" != "$bot" ]; then
              echo "::error::PR #$pr has commits that are not the bot's. Merge or close it so the sync can run."
              exit 1
            fi
            remote=FETCH_HEAD
          fi

          git config user.name "$bot"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -q -c "$branch"
          git commit -qam "$title"
          if [ -n "$pr" ] && [ -n "${remote:-}" ] && git diff --quiet "$remote" HEAD; then
            echo "PR #$pr already has these changes."
            exit 0
          fi
          git push -q --force origin "$branch"
          if [ -n "$pr" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -f title="$title" -F body=@"$RUNNER_TEMP/body.md" >/dev/null
          else
            gh pr create --base master --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Fail if the sync failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::The sync failed, see its step. If Adobe recommends a version the services list can't run, add it to services in matrix.yml."
          exit 1
