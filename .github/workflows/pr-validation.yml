name: PR Validation

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - master

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-checks:
    name: Go Unit Tests And Builds
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Run Go tests
        run: go test ./...

      - name: Build CLI binary
        run: go build -trimpath ./cmd/cli

      - name: Build builder binary
        run: go build -trimpath ./cmd/builder

  site-checks:
    name: Site Build And Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro checks
        run: pnpm run check

      - name: Build site
        run: pnpm run build

  smoke-test:
    name: Baseline Smoke Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build builder binary
        run: go build -trimpath -o ./bin/magento-compatibility-builder ./cmd/builder

      - name: Run baseline smoke test
        run: |
          mkdir -p "${RUNNER_TEMP}/results"
          ./bin/magento-compatibility-builder test \
            -baseline \
            -product magento \
            -version 2.4.9 \
            -playwright=false \
            -no-tui \
            -force \
            -max-log-bytes 262144 \
            -results-dir "${RUNNER_TEMP}/results"

      - name: Upload smoke-test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-artifacts
          path: |
            ${{ runner.temp }}/results
            app/test-results
          if-no-files-found: ignore
