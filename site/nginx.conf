server {
    listen 80;
    root /usr/share/nginx/html;

    # Relative redirects (/check -> /check/) so they keep the scheme and host the TLS proxy in front was reached on.
    absolute_redirect off;
    # The site's 404 page carries the RUM snippet like every other page.
    error_page 404 /404.html;

    # Hashed by the build, so the name changes whenever the content does.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000";
    }

    # Pages, the API and logs only change on a deploy: the browser checks back after five minutes, Cloudflare keeps
    # them until the deploy purges it. add_header skips error responses, so Cloudflare never keeps a 404.
    location / {
        add_header Cache-Control "public, max-age=300";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000";
        # Service pages moved from patch to major.minor slugs: /software/db/mysql-8.0.46/ -> /software/db/mysql-8.0/
        rewrite "^(/.+/[a-z]+-\d+\.\d+)\.\d+/?$" $1/ permanent;
    }
}
