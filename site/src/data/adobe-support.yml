# Adobe's support dates for each Magento release line, copied by hand from the Adobe Commerce
# lifecycle policy. Check it when Adobe ships a new line or the page's "Last update" changes:
# https://experienceleague.adobe.com/en/docs/commerce-operations/release/planning/lifecycle-policy
#
#   standard       end of standard support: quality and security patches
#   extended       end of extended support, free to Adobe Commerce customers
#   security_only  end of the one-off security-only period
#
# Release dates are not kept here: they come from release-dates.json (go run ./cmd/release-dates).
# 2.4.2 and 2.4.3 have dropped off Adobe's page. Their 28th November 2022 end date is the one
# magento.watch (https://magento.watch) by Lukasz Bajsarowicz records.
